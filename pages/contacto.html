<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Academia Ficticia - Contacto</title>
    <link rel="stylesheet" href="../assets/css/menu.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css.map">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.rtl.min.css.map">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- Menú -->
    <div id="menu-container" class="sticky-top"></div>

    <!-- seccion de contactos -->
    <section>
        <div class="container py-5">
            <h1 class="text-center texto-azul-900 fw-bold">Contáctanos</h1>
            <p class="text-center">
                Tienes alguna pregunta? Puedes contactarne con nuestros expertos ahora mismo!
            </p>
            <div class="d-flex justify-content-center flex-wrap gap-3">
                <div>
                    <img class="rounded-circle" src="/img/perfil_1.jpg" alt="" width="65" height="65">
                </div>
                <div>
                    <img class="rounded-circle" src="/img/perfil_2.jpg" alt="" width="65" height="65">
                </div>
                <div>
                    <img class="rounded-circle" src="/img/perfil_3.jpg" alt="" width="65" height="65">
                </div>
            </div>
            <div class="d-flex justify-content-center flex-wrap gap-5 my-5">
                <div class="text-center">
                    <span class="fs-1 texto-azul-900"><i class="fa-brands fa-whatsapp"></i></i></span>
                    <p>Escribe Whatsapp</p>
                    <a href="">999-999-999</a>
                </div>
                <div class="text-center">
                    <span class="fs-1 texto-azul-900"><i class="fa-brands fa-instagram"></i></span>
                    <p>Explora y siguenos!!</p>
                    <a href="">Instagram</a>
                </div>
                <div class="text-center">
                    <span class="fs-1 texto-azul-900"><i class="fa-regular fa-envelope"></i></span>
                    <p>Envía un correo!!</p>
                    <a href="">Envíar</a>
                </div>
                <div class="text-center">
                    <span class="fs-1 texto-azul-900"><i class="fa-brands fa-twitch"></i></span>
                    <p>Nuestro contenido!!</p>
                    <a href="">Twitch</a>
                </div>
            </div>
        </div>
    </section>

    <!-- seccion mapa y formulario -->
    <section class="bg-azul-100">
        <div class="container py-5">
            <div class="row row-gap-4">
                <div class="col-lg-6 text-center">
                    <h2 class="">Ubicanos!</h2>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3900.805575440028!2d-77.02739782517345!3d-12.125451388117579!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c81c605ea5e1%3A0x17328a8b49d37914!2sISIL%20-%20Miraflores!5e0!3m2!1ses-419!2spe!4v1783784410167!5m2!1ses-419!2spe"
                        width="450" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
                <div class="col-lg-6">
                    <h2 class="text-center">Envía tu consulta</h2>
                    <form id="formulario_contacto">
                        <div class="mb-3">
                            <label for="nombre_completo" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre_completo"
                                placeholder="Juan Perez" required>
                        </div>
                        <div class="mb-3">
                            <label for="celular" class="form-label">Celular</label>
                            <input type="tel" class="form-control" id="celular"
                                placeholder="999-999-999" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email"
                                placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/bootstrap/js/bootstrap.bundle.min.js.map"></script>
</body>

</html>
